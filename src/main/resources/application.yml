spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tarefas}
    username: ${DB_USER:tarefas}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
auth:
  issuer: ${AUTH0_ISSUER}
  audience: ${AUTH0_AUDIENCE}
app:
  cors-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
