name: prova-tarefas
services:
  db:
    mem_limit: 256m
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tarefas
      POSTGRES_USER: tarefas
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Preencha DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tarefas -d tarefas"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    mem_limit: 512m
    image: ${API_IMAGE:-tarefas-api:local}
    build: .
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://db:5432/tarefas
      DB_USER: tarefas
      DB_PASSWORD: ${DB_PASSWORD:?Preencha DB_PASSWORD}
      AUTH0_ISSUER: ${AUTH0_ISSUER:?Preencha AUTH0_ISSUER}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:?Preencha AUTH0_AUDIENCE}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
